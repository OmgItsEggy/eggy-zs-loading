name: Add rare loading video 2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-rare-video2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Download toothbrush clip
        run: |
          yt-dlp --no-playlist "https://coub.com/view/198t43" -o "video2_source.%(ext)s"
          ls -lh video2_source.*

      - name: Convert for Garry's Mod
        run: |
          SOURCE="$(find . -maxdepth 1 -type f -name 'video2_source.*' | head -n 1)"
          ffmpeg -y -i "$SOURCE" \
            -c:v libvpx -b:v 0 -crf 32 \
            -c:a libvorbis -q:a 4 \
            rare_video2_gmod.webm

      - name: Commit video and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rare_video2_gmod.webm
          git rm .github/workflows/add-rare-video2.yml

          git commit -m "Add second rare loading video"
          git push
