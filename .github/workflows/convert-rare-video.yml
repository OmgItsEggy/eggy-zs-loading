name: Convert rare loading video

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-rare-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert MP4 to GMod-friendly WebM
        run: |
          ffmpeg -y -i rare_video1.mp4 \
            -c:v libvpx -b:v 0 -crf 32 \
            -c:a libvorbis -q:a 4 \
            rare_video1_gmod.webm

      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rare_video1_gmod.webm

          if git diff --cached --quiet; then
            echo "No converted video changes to commit."
            exit 0
          fi

          git commit -m "Add GMod-friendly rare loading video"
          git push
