<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #joinscreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #000;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img id="joinscreen" alt="">
  <audio id="music" preload="auto"></audio>

  <script>
    const splashImages = [
      "egg_zs_loading_pack/splash_darkrp.png",
      "egg_zs_loading_pack/splash_cod.png"
    ];

    const musicTracks = [
      "omfg_hello.mp3",
      "OMFG_Everybody.mp3",
      "OMFG_IceCream.mp3",
      "OMFG_Ok.mp3",
      "OMFG_Yeah.mp3"
    ];

    const splash =
      splashImages[
        Math.floor(Math.random() * splashImages.length)
      ];

    document.getElementById("joinscreen").src = splash;

    const music = document.getElementById("music");

    let currentTrack = -1;

    function chooseNextTrack() {
      if (musicTracks.length === 0) {
        return;
      }

      if (musicTracks.length === 1) {
        currentTrack = 0;
      } else {
        let nextTrack;

        do {
          nextTrack =
            Math.floor(Math.random() * musicTracks.length);
        } while (nextTrack === currentTrack);

        currentTrack = nextTrack;
      }

      music.src = musicTracks[currentTrack];
      music.load();
    }

    function startMusic(volume) {
      const v = Number(volume);

      music.volume =
        Number.isFinite(v)
          ? Math.max(0, Math.min(1, v))
          : 0.5;

      if (currentTrack === -1) {
        chooseNextTrack();
      }

      music.play().catch(function () {});
    }

    music.addEventListener("ended", function () {
      chooseNextTrack();
      music.play().catch(function () {});
    });

    function GameDetails(
      serverName,
      serverURL,
      mapName,
      maxPlayers,
      steamID,
      gamemode,
      volume,
      language
    ) {
      startMusic(volume);
    }

    window.addEventListener("load", function () {
      startMusic(0.5);
    });
  </script>
</body>
</html>
