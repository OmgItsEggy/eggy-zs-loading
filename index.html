<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #joinscreen,
    #rarevideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #000;
    }

    #joinscreen {
      user-select: none;
      -webkit-user-drag: none;
    }

    #rarevideo {
      display: none;
    }
  </style>
</head>
<body>
  <img id="joinscreen" alt="">
  <video id="rarevideo" src="rare_video1.mp4" preload="auto" playsinline></video>
  <audio id="music" preload="auto"></audio>

  <script>
    ------------------------------------------------------------
    -- TEST SETTING
    --
    -- 0.99 = 99% chance of the rare video.
    -- After testing, change this to 0.05 for 5%.
    ------------------------------------------------------------
  </script>

  <script>
    const rareVideoChance = 0.99;

    const splashImages = [
      "egg_zs_loading_pack/splash_darkrp.png",
      "egg_zs_loading_pack/splash_cod.png"
    ];

    const musicTracks = [
      "omfg_hello.mp3",
      "OMFG_Everybody.mp3",
      "OMFG_IceCream.mp3",
      "OMFG_Ok.mp3",
      "OMFG_Yeah.mp3"
    ];

    const joinscreen = document.getElementById("joinscreen");
    const rareVideo = document.getElementById("rarevideo");
    const music = document.getElementById("music");

    let mode =
      Math.random() < rareVideoChance
        ? "rare"
        : "normal";

    let currentTrack = -1;
    let currentVolume = 0.5;
    let rareVideoStarted = false;


    ------------------------------------------------------------
    -- NORMAL SPLASH
    ------------------------------------------------------------

    function chooseSplash() {
      const splash =
        splashImages[
          Math.floor(Math.random() * splashImages.length)
        ];

      joinscreen.src = splash;
    }


    ------------------------------------------------------------
    -- MUSIC
    ------------------------------------------------------------

    function chooseNextTrack() {
      if (musicTracks.length === 0) {
        return;
      }

      if (musicTracks.length === 1) {
        currentTrack = 0;
      } else {
        let nextTrack;

        do {
          nextTrack =
            Math.floor(Math.random() * musicTracks.length);
        } while (nextTrack === currentTrack);

        currentTrack = nextTrack;
      }

      music.src = musicTracks[currentTrack];
      music.load();
    }


    function setVolume(volume) {
      const v = Number(volume);

      currentVolume =
        Number.isFinite(v)
          ? Math.max(0, Math.min(1, v))
          : 0.5;

      music.volume = currentVolume;
      rareVideo.volume = currentVolume;
    }


    function startMusic() {
      if (currentTrack === -1) {
        chooseNextTrack();
      }

      music.play().catch(function () {});
    }


    music.addEventListener("ended", function () {
      chooseNextTrack();
      music.play().catch(function () {});
    });


    ------------------------------------------------------------
    -- NORMAL LOADING SCREEN
    ------------------------------------------------------------

    function startNormalLoadingScreen() {
      mode = "normal";

      rareVideo.pause();
      rareVideo.style.display = "none";

      joinscreen.style.display = "block";

      if (!joinscreen.src) {
        chooseSplash();
      }

      startMusic();
    }


    ------------------------------------------------------------
    -- RARE VIDEO
    ------------------------------------------------------------

    function startRareVideo() {
      if (mode !== "rare") {
        return;
      }

      music.pause();
      joinscreen.style.display = "none";
      rareVideo.style.display = "block";

      setVolume(currentVolume);

      if (!rareVideoStarted) {
        rareVideoStarted = true;
        rareVideo.currentTime = 0;
      }

      rareVideo.play().catch(function () {
        startNormalLoadingScreen();
      });
    }


    rareVideo.addEventListener("ended", function () {
      startNormalLoadingScreen();
    });


    rareVideo.addEventListener("error", function () {
      startNormalLoadingScreen();
    });


    ------------------------------------------------------------
    -- START SELECTED MODE
    ------------------------------------------------------------

    function startSelectedMode(volume) {
      setVolume(volume);

      if (mode === "rare") {
        startRareVideo();
      } else {
        startNormalLoadingScreen();
      }
    }


    ------------------------------------------------------------
    -- GMOD LOADING SCREEN CALLBACK
    ------------------------------------------------------------

    function GameDetails(
      serverName,
      serverURL,
      mapName,
      maxPlayers,
      steamID,
      gamemode,
      volume,
      language
    ) {
      startSelectedMode(volume);
    }


    ------------------------------------------------------------
    -- FALLBACK START
    ------------------------------------------------------------

    window.addEventListener("load", function () {
      startSelectedMode(0.5);
    });
  </script>
</body>
</html>
